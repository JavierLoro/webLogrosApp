<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Lockerboard LB construction grid</title>
  <desc id="desc">Measured construction blueprint for the Lockerboard LB symbol. Not a production logo.</desc>
  <rect width="1100" height="620" fill="#0C0E12"/>
  <g transform="translate(54 54)">
    <rect width="512" height="512" fill="#111317" stroke="#34373E"/>
    <g stroke="#282A2E" stroke-width="1">
      <path d="M0 43H512M0 133H512M0 283H512M0 301H512M0 355H512M0 469H512"/>
      <path d="M67 0V512M145 0V512M175 0V512M253 0V512M313 0V512M445 0V512"/>
    </g>
    <rect x="67" y="43" width="378" height="426" fill="none" stroke="#55E16B" stroke-dasharray="7 6"/>
    <rect x="175" y="133" width="270" height="336" fill="none" stroke="#8E929B" stroke-dasharray="5 5"/>
    <path fill="#E2E2E8" fill-rule="evenodd" opacity=".9" d="M175 133h180c50 0 90 40 90 90 0 30-16 54-42 78l36 36c4 14 6 30 6 48 0 46-38 84-84 84H175V133Zm78 66h114v48l-30 30h-84v-78Zm0 126h84l30 30v48H253v-78Z"/>
    <path fill="#0C0E12" d="M61 37h114v222h162v120H61Z"/>
    <path fill="#FF5545" d="M67 43h78v240h168v72H67Z"/>
    <path d="M0 301H512" stroke="#FE9400" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="313" cy="319" r="5" fill="#FFB4AA"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#E2E2E8">
    <text x="620" y="78" font-size="26" font-weight="700">LB · RESTRICCIONES MAESTRAS</text>
    <text x="620" y="122" font-size="16" fill="#A9ADB6">Artboard SVG: 512 × 512</text>
    <text x="620" y="158" font-size="16">Caja visible</text>
    <text x="810" y="158" font-size="16" fill="#55E16B">378 × 426 u</text>
    <text x="620" y="194" font-size="16">L · asta</text>
    <text x="810" y="194" font-size="16">78 u</text>
    <text x="620" y="230" font-size="16">L · brazo</text>
    <text x="810" y="230" font-size="16">72 u</text>
    <text x="620" y="266" font-size="16">Eje de la B</text>
    <text x="810" y="266" font-size="16" fill="#FE9400">y = 301</text>
    <text x="620" y="302" font-size="16">Centro brazo L</text>
    <text x="810" y="302" font-size="16" fill="#FFB4AA">y = 319</text>
    <text x="620" y="338" font-size="16">Desfase</text>
    <text x="810" y="338" font-size="16">+18 u hacia abajo</text>
    <text x="620" y="374" font-size="16">Gap transparente</text>
    <text x="810" y="374" font-size="16">24 u nominal</text>
    <text x="620" y="410" font-size="16">B · radio superior</text>
    <text x="810" y="410" font-size="16">≈ 48 u</text>
    <text x="620" y="446" font-size="16">B · radio inferior</text>
    <text x="810" y="446" font-size="16">≈ 72 u</text>
    <text x="620" y="482" font-size="16">Interior B</text>
    <text x="810" y="482" font-size="16">chaflanes 45° reflejados</text>
    <text x="620" y="526" font-size="14" fill="#8E929B">Documento de construcción — no usar como logo</text>
  </g>
</svg>
