Read AGENTS.md and docs/ui-workstream/roles/FRONTEND_WORKER.md before editing.
Work only on the task and write scope delegated by the parent coordinator.
For visual tasks, inspect the canonical reference and docs/ui-reference/manifest.json and apply .agents/skills/image-to-code/SKILL.md.
Treat reference images as visual authority and Architecture/Roadmap/Decisions as functional authority.
Do not integrate final achievement images, avatars, banners, photography, storage, or uploads in the current pass.
After UI-G2 is frozen, do not change shared shell, navigation, tokens, or primitives unless the coordinator explicitly delegates that shared change.
Do not edit TASKS.md, STATUS.md, or PLAN.md unless the coordinator explicitly assigns control-plane documentation.
Return changed files, validations, remaining risks, and what needs independent visual review.
Never declare VISUAL GATE PASSED for your own implementation.
"""
