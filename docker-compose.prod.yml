services:
  db:
    image: postgres:16
    container_name: weblogros_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # 📚 HEALTHCHECK: comando que Compose ejecuta periódicamente DENTRO del contenedor.
    #    exit 0 = sano, exit ≠0 = enfermo. pg_isready viene en la imagen postgres y comprueba
    #    que Postgres ACEPTA conexiones (no basta con que el contenedor "exista"). CMD-SHELL
    #    lo pasa por un shell para expandir las ${VARIABLES}. Marca el servicio como "healthy"
    #    → es la señal que espera el depends_on del backend.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/javierloro/weblogros-backend:latest
    container_name: weblogros_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    # 📚 depends_on LARGO (mapa, sin guion): no arranca el backend hasta que db esté "healthy".
    #    La sintaxis corta (- db) solo espera a que db ARRANQUE, no a que esté LISTO → de ahí el
    #    clásico ECONNREFUSED de arranque. service_healthy cierra ese hueco.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # 📚 HEALTHCHECK del backend con Node: la imagen NO trae curl/wget (Node minimalista), pero
    #    sí Node, que en v18+ tiene fetch global. El JS hace fetch a /health y traduce la
    #    respuesta a exit code: 200 (r.ok) → 0 sano; 503 o fallo → 1 enfermo.
    # 📚 start_period (aquí 10s): durante ese margen inicial los fallos NO cuentan como retries →
    #    margen para que el backend arranque (Prisma, conexión) sin que Compose lo mate.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/javierloro/weblogros-frontend:latest
    container_name: weblogros_frontend
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: nginx:alpine
    container_name: weblogros_nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # 📚 nginx mezcla condiciones a propósito: espera a que el backend esté SANO (tiene
    #    healthcheck) pero al frontend solo ARRANCADO (aún no le dimos healthcheck).
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: weblogros_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      DOCKER_API_VERSION: "1.41"
    command: --label-enable
    restart: unless-stopped


  # 📚 BACKUP sidecar DIY: los datos son lo ÚNICO irrecuperable. Watchtower auto-despliega, así
  #    que una migración destructiva podría llegar sola → este dump periódico es la red de seguridad.
  backup:
    image: postgres:16          # 📚 misma versión que db → pg_dump 100% compatible con el servidor
    container_name: weblogros_backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # 📚 PGPASSWORD: libpq (la lib cliente de Postgres) la lee sola → no ponemos la contraseña
      #    en el comando pg_dump. La resuelve Compose desde el .env (aquí SÍ queremos ${...}).
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # 📚 bind mount: el dump se escribe en /backups (dentro) pero persiste en ./backups (host).
      #    Sin esto, al recrear el contenedor perderías los backups.
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy   # 📚 no dumpear una BD que aún no acepta conexiones
    restart: unless-stopped
    # 📚 Bucle: dump → borrar viejos → dormir 24h → repetir. pg_dump = backup LÓGICO (SQL que
    #    recrea estructura + datos), no copia binaria. -h db resuelve por DNS interno de Docker.
    #    | gzip comprime al vuelo. find -mtime +7 -delete = retención casera (últimos 7 días).
    # 📚 CLAVE del $$: Compose también usa $ para SUS variables. $$ escapa el $ para que llegue
    #    al SHELL del contenedor (runtime), no a Compose. Por eso $$POSTGRES_USER y $$(date ...).
    entrypoint: >
      bash -c "while true; do
      pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB | gzip > /backups/weblogros-$$(date +%Y%m%d-%H%M%S).sql.gz;
      find /backups -name '*.sql.gz' -mtime +7 -delete;
      sleep 86400;
      done"
volumes:
  postgres_data:
